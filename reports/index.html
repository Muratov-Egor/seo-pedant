<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO-аудит aviasales.ru — история прогонов</title>
<style>
/* Дизайн-токены переиспользованы из прототипа одиночного отчёта (report-proto.html),
   чтобы дашборд истории и отчёты одного прогона читались как одна система. */
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel-2:#fbfcfe; --ink:#1a1d27; --ink-soft:#565b6b;
  --line:#e4e7ef; --line-strong:#d2d7e3;
  --accent:#3b5bdb; --accent-soft:#e7ecfd;
  --p1:#d6336c; --p1-bg:#fce4ec; --p2:#e8890c; --p2-bg:#fdf0dc; --p3:#5b73d6; --p3-bg:#e9edfb;
  --ok:#2f9e44; --ok-bg:#e6f4ea;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1016; --panel:#171a23; --panel-2:#1c1f2b; --ink:#e8eaf1; --ink-soft:#9aa0b2;
  --line:#262a38; --line-strong:#333849; --accent:#7089f7; --accent-soft:#20263c;
  --p1:#ff85a8; --p1-bg:#2c1721; --p2:#ffb454; --p2-bg:#2c2213; --p3:#8ea0f0; --p3-bg:#1a1f34;
  --ok:#69db7c; --ok-bg:#15251a;
}}
:root[data-theme="light"]{
  --bg:#f5f6fa; --panel:#fff; --panel-2:#fbfcfe; --ink:#1a1d27; --ink-soft:#565b6b;
  --line:#e4e7ef; --line-strong:#d2d7e3; --accent:#3b5bdb; --accent-soft:#e7ecfd;
  --p1:#d6336c; --p1-bg:#fce4ec; --p2:#e8890c; --p2-bg:#fdf0dc; --p3:#5b73d6; --p3-bg:#e9edfb; --ok:#2f9e44; --ok-bg:#e6f4ea;
}
:root[data-theme="dark"]{
  --bg:#0e1016; --panel:#171a23; --panel-2:#1c1f2b; --ink:#e8eaf1; --ink-soft:#9aa0b2;
  --line:#262a38; --line-strong:#333849; --accent:#7089f7; --accent-soft:#20263c;
  --p1:#ff85a8; --p1-bg:#2c1721; --p2:#ffb454; --p2-bg:#2c2213; --p3:#8ea0f0; --p3-bg:#1a1f34; --ok:#69db7c; --ok-bg:#15251a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.86em}

/* шапка */
.masthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px}
.masthead h1{font-size:22px;font-weight:680;letter-spacing:-.01em;margin:0}
.masthead .run{font-family:var(--mono);color:var(--accent);font-size:15px}
.sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px}
.themebtn{margin-left:auto;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-soft);
  border-radius:8px;padding:6px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .hint{font-size:12px;color:var(--ink-soft);margin-top:2px}
.delta-down{color:var(--ok);font-weight:650}
.delta-up{color:var(--p1);font-weight:650}
.delta-flat{color:var(--ink-soft);font-weight:650}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 12px;font-weight:650}
.grid2{display:grid;grid-template-columns:1.4fr .6fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

/* легенда графиков */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

svg{display:block;width:100%;height:auto}
.gridline{stroke:var(--line);stroke-width:1}
.axtext{fill:var(--ink-soft);font-size:11px;font-family:var(--sans)}
.axtext.tab{font-variant-numeric:tabular-nums}

/* деградация / улучшение */
.deltas{display:flex;flex-direction:column;gap:9px}
.drow{display:flex;align-items:center;gap:10px;font-size:13px}
.drow .dot{width:10px;height:10px;border-radius:3px;flex:none}
.drow .nm{color:var(--ink)}
.drow .vv{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650}

/* таблица прогонов */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:650;padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.runid{font-family:var(--mono);font-weight:600}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.b-P1{color:var(--p1);background:var(--p1-bg)} .b-P2{color:var(--p2);background:var(--p2-bg)} .b-P3{color:var(--p3);background:var(--p3-bg)}
.b-new{color:var(--accent);background:var(--accent-soft)}
.lnk{font-size:12px;color:var(--accent)}
.lnk+.lnk{margin-left:8px}
.muted{color:var(--ink-soft)}
.state{color:var(--ink-soft);padding:40px 0;text-align:center}
.err{color:var(--p1)}
.actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.navbtn{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-soft);
  border-radius:8px;padding:6px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none}
.navbtn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
</style>

<div class="wrap">
  <div class="masthead">
    <h1>SEO-аудит aviasales.ru</h1>
    <span class="run">история прогонов</span>
    <div class="actions">
      <a class="navbtn" href="settings.html">Настройки</a>
      <button class="navbtn" id="themebtn" type="button">Тема</button>
    </div>
  </div>
  <div class="sub" id="sub">Загрузка данных…</div>

  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>

    <div class="grid2">
      <div class="card">
        <h2>Динамика находок по прогонам</h2>
        <div id="chartStack"></div>
        <div class="legend">
          <span><i style="background:var(--p1)"></i>P1</span>
          <span><i style="background:var(--p2)"></i>P2</span>
          <span><i style="background:var(--p3)"></i>P3</span>
        </div>
      </div>
      <div class="card">
        <h2>Что изменилось vs прошлый прогон</h2>
        <div class="deltas" id="deltas"></div>
      </div>
    </div>

    <div class="card">
      <h2>Burn-down критичных (P1) по прогонам</h2>
      <div id="chartP1"></div>
    </div>

    <div class="card">
      <h2>Все прогоны</h2>
      <div class="tblwrap">
        <table>
          <thead><tr>
            <th>Прогон</th><th>Дата</th><th class="num">Всего</th>
            <th class="num">P1</th><th class="num">P2</th><th class="num">P3</th>
            <th class="num">Новых</th><th>Отчёты</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="state err" id="errbox" hidden></div>
</div>

<script>
/* ---- тема ---- */
const rootEl=document.documentElement;
document.getElementById('themebtn').addEventListener('click',()=>{
  const cur=rootEl.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  rootEl.setAttribute('data-theme',cur==='dark'?'light':'dark');
});

/* ---- утилиты ---- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// сравнение runId: сначала дата, затем числовой суффикс (-2,-3); базовый прогон = 1
function runParts(run){
  const m=run.match(/^(\d{4}-\d{2}-\d{2})(?:-(\d+))?$/);
  return m?[m[1],m[2]?+m[2]:1]:[run,1];
}
function cmpRun(a,b){
  const [da,sa]=runParts(a),[db,sb]=runParts(b);
  return da<db?-1:da>db?1:sa-sb;
}

/* ---- загрузка NDJSON ---- */
async function load(){
  let text;
  try{
    const res=await fetch('../data/history.ndjson',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    text=await res.text();
  }catch(e){
    $('sub').textContent='';
    const b=$('errbox'); b.hidden=false;
    b.innerHTML='Не удалось загрузить <code>../data/history.ndjson</code>: '+esc(e.message)+
      '<br>При открытии через <code>file://</code> браузер блокирует fetch. '+
      'Запустите статический сервер из корня репозитория (<code>python3 -m http.server</code>) '+
      'и откройте <code>/reports/index.html</code>, либо смотрите страницу на GitHub Pages.';
    return;
  }
  const rows=text.trim().split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l);}catch{return null;}}).filter(Boolean);
  render(rows);
}

/* ---- агрегация по прогонам ---- */
function aggregate(rows){
  const byRun=new Map();
  for(const r of rows){
    if(!byRun.has(r.run)) byRun.set(r.run,{run:r.run,date:r.date||runParts(r.run)[0],
      total:0,P1:0,P2:0,P3:0,new:0});
    const a=byRun.get(r.run);
    a.total++;
    if(a[r.severity]!==undefined) a[r.severity]++;
    if(r.status==='new') a.new++;
  }
  return [...byRun.values()].sort((x,y)=>cmpRun(x.run,y.run)); // по возрастанию
}

function render(rows){
  const runs=aggregate(rows);
  if(!runs.length){ $('sub').textContent='Нет данных.'; return; }
  const last=runs[runs.length-1], prev=runs.length>1?runs[runs.length-2]:null;

  $('sub').innerHTML='Прогонов: <b>'+runs.length+'</b> · находок в базе: <b class="num">'+rows.length+
    '</b> · последний прогон <b class="num">'+esc(last.run)+'</b>';
  $('app').hidden=false;

  renderKPI(last,prev);
  renderStack('chartStack',runs);
  renderP1('chartP1',runs);
  renderDeltas(last,prev);
  renderTable(runs);
}

/* ---- KPI по последнему прогону ---- */
function deltaHTML(cur,prev,invert){
  if(prev==null) return '';
  const d=cur-prev;
  if(d===0) return '<span class="delta-flat">±0</span>';
  // рост находок = плохо (красный), invert для «улучшилось»
  const bad=invert?d<0:d>0;
  const cls=bad?'delta-up':'delta-down';
  return '<span class="'+cls+'">'+(d>0?'▲ +':'▼ ')+d+'</span>';
}
function renderKPI(last,prev){
  const cards=[
    {lab:'Всего находок',val:last.total,d:prev&&last.total-prev.total,stripe:'var(--accent)'},
    {lab:'Критичных P1',val:last.P1,d:prev&&last.P1-prev.P1,stripe:'var(--p1)'},
    {lab:'Новых в прогоне',val:last.new,d:prev&&last.new-prev.new,stripe:'var(--p2)'},
    {lab:'P2 / P3',val:last.P2+' / '+last.P3,d:null,stripe:'var(--p3)'},
  ];
  $('kpis').innerHTML=cards.map(c=>{
    let hint='';
    if(c.d!=null){
      const bad=c.d>0, cls=c.d===0?'delta-flat':bad?'delta-up':'delta-down';
      hint='<div class="hint"><span class="'+cls+'">'+(c.d>0?'▲ +':c.d<0?'▼ ':'±')+c.d+
        '</span> vs прошлый</div>';
    }
    return '<div class="kpi"><i class="stripe" style="background:'+c.stripe+'"></i>'+
      '<div class="lab">'+c.lab+'</div><div class="val num">'+c.val+'</div>'+hint+'</div>';
  }).join('');
}

/* ---- вспом. для SVG ---- */
function niceMax(v){
  if(v<=0) return 10;
  const pow=Math.pow(10,Math.floor(Math.log10(v)));
  for(const m of [1,2,2.5,5,10]){ if(pow*m>=v) return pow*m; }
  return pow*10;
}

/* ---- стек-бары по severity ---- */
function renderStack(id,runs){
  const W=680,H=260,PL=44,PR=12,PT=12,PB=54;
  const iw=W-PL-PR, ih=H-PT-PB;
  const maxV=niceMax(Math.max(...runs.map(r=>r.total)));
  const n=runs.length, bw=Math.min(56, iw/n*0.62), step=iw/n;
  const y=v=>PT+ih-(v/maxV)*ih;
  let g='';
  // сетка + оси Y
  for(let i=0;i<=4;i++){
    const v=maxV*i/4, yy=y(v);
    g+='<line class="gridline" x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'"/>';
    g+='<text class="axtext tab" x="'+(PL-8)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(v)+'</text>';
  }
  const segs=[['P3','var(--p3)'],['P2','var(--p2)'],['P1','var(--p1)']];
  runs.forEach((r,i)=>{
    const cx=PL+step*i+step/2, x=cx-bw/2;
    let acc=0;
    for(const [k,col] of segs){
      const h=(r[k]/maxV)*ih;
      if(h>0){ g+='<rect x="'+x.toFixed(1)+'" y="'+(y(acc)-h).toFixed(1)+'" width="'+bw.toFixed(1)+
        '" height="'+h.toFixed(1)+'" fill="'+col+'"><title>'+esc(r.run)+' · '+k+': '+r[k]+'</title></rect>'; }
      acc+=r[k];
    }
    g+='<text class="axtext tab" x="'+cx+'" y="'+(y(acc)-6).toFixed(1)+'" text-anchor="middle" style="font-weight:650">'+r.total+'</text>';
    // подпись прогона (наклон)
    g+='<text class="axtext" x="'+cx+'" y="'+(PT+ih+16)+'" text-anchor="end" transform="rotate(-30 '+cx+' '+(PT+ih+16)+')">'+esc(r.run)+'</text>';
  });
  $(id).innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Стек находок по прогонам">'+g+'</svg>';
}

/* ---- линия P1 (burn-down) ---- */
function renderP1(id,runs){
  const W=680,H=200,PL=36,PR=14,PT=14,PB=48;
  const iw=W-PL-PR, ih=H-PT-PB;
  const maxV=niceMax(Math.max(4,...runs.map(r=>r.P1)));
  const n=runs.length, step=n>1?iw/(n-1):0;
  const x=i=>PL+step*i, y=v=>PT+ih-(v/maxV)*ih;
  let g='';
  for(let i=0;i<=4;i++){
    const v=maxV*i/4, yy=y(v);
    g+='<line class="gridline" x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'"/>';
    g+='<text class="axtext tab" x="'+(PL-8)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(v)+'</text>';
  }
  const pts=runs.map((r,i)=>[x(i),y(r.P1)]);
  // область под линией
  const area='M'+PL+','+(PT+ih)+' '+pts.map(p=>'L'+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+
    ' L'+x(n-1)+','+(PT+ih)+' Z';
  g+='<path d="'+area+'" fill="var(--p1-bg)" opacity="0.7"/>';
  g+='<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+
    '" fill="none" stroke="var(--p1)" stroke-width="2.5"/>';
  runs.forEach((r,i)=>{
    g+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(r.P1).toFixed(1)+'" r="3.5" fill="var(--p1)"><title>'+esc(r.run)+' · P1: '+r.P1+'</title></circle>';
    g+='<text class="axtext tab" x="'+x(i).toFixed(1)+'" y="'+(y(r.P1)-8).toFixed(1)+'" text-anchor="middle" style="font-weight:650">'+r.P1+'</text>';
    g+='<text class="axtext" x="'+x(i).toFixed(1)+'" y="'+(PT+ih+16)+'" text-anchor="end" transform="rotate(-30 '+x(i).toFixed(1)+' '+(PT+ih+16)+')">'+esc(r.run)+'</text>';
  });
  $(id).innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Динамика P1">'+g+'</svg>';
}

/* ---- деградация / улучшение ---- */
function renderDeltas(last,prev){
  const box=$('deltas');
  if(!prev){ box.innerHTML='<div class="state">Это первый прогон — сравнивать не с чем.</div>'; return; }
  const items=[
    {nm:'Всего находок',c:'var(--accent)',d:last.total-prev.total},
    {nm:'Критичные P1',c:'var(--p1)',d:last.P1-prev.P1},
    {nm:'P2',c:'var(--p2)',d:last.P2-prev.P2},
    {nm:'P3',c:'var(--p3)',d:last.P3-prev.P3},
    {nm:'Новые находки',c:'var(--accent)',d:last.new-prev.new},
  ];
  box.innerHTML=items.map(it=>{
    const cls=it.d===0?'delta-flat':it.d>0?'delta-up':'delta-down';
    const txt=it.d===0?'без изменений':(it.d>0?'+'+it.d+' (деградация)':it.d+' (улучшение)');
    return '<div class="drow"><i class="dot" style="background:'+it.c+'"></i>'+
      '<span class="nm">'+it.nm+'</span>'+
      '<span class="vv '+cls+'">'+txt+'</span></div>';
  }).join('')+'<div class="sub" style="margin:8px 0 0">относительно прогона <code>'+esc(prev.run)+'</code></div>';
}

/* ---- таблица прогонов (по убыванию) ---- */
function renderTable(runs){
  const rows=[...runs].reverse();
  $('tbody').innerHTML=rows.map(r=>
    '<tr>'+
    '<td class="runid">'+esc(r.run)+'</td>'+
    '<td class="num">'+esc(r.date)+'</td>'+
    '<td class="num">'+r.total+'</td>'+
    '<td class="num"><span class="badge b-P1">'+r.P1+'</span></td>'+
    '<td class="num"><span class="badge b-P2">'+r.P2+'</span></td>'+
    '<td class="num"><span class="badge b-P3">'+r.P3+'</span></td>'+
    '<td class="num"><span class="badge b-new">'+r.new+'</span></td>'+
    '<td class="rep">'+
    '<a class="lnk" href="'+encodeURIComponent(r.run)+'.html">HTML</a>'+
    '<a class="lnk" href="'+encodeURIComponent(r.run)+'.md">MD</a></td>'+
    '</tr>'
  ).join('');
  probeReports();
}

// файлы отчётов появляются в reports/ только после прогона (у старых прогонов есть
// только .md). Проверяем существование HEAD-запросом и убираем ссылки на то, чего нет.
async function probeReports(){
  for(const cell of document.querySelectorAll('#tbody .rep')){
    for(const a of [...cell.querySelectorAll('a')]){
      let ok=false;
      try{ ok=(await fetch(a.getAttribute('href'),{method:'HEAD',cache:'no-store'})).ok; }catch{}
      if(!ok) a.remove();
    }
    if(!cell.querySelector('a')) cell.innerHTML='<span class="muted">—</span>';
  }
}

load();
</script>
